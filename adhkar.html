<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E211C">
<title>Adhkar — Sabah &amp; Masa&#39;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@500;700&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C19A3D;
    --gold-soft:#C19A3D55;
  }
  body.sabah{
    --bg:#F4EEDF;
    --bg-2:#ECE4D0;
    --ink:#16332B;
    --ink-soft:#16332BAA;
    --ink-faint:#16332B3D;
    --card:#FBF7EC;
    --ring-track:#16332B1F;
  }
  body.masa{
    --bg:#0E211C;
    --bg-2:#132B24;
    --ink:#EFE9DA;
    --ink-soft:#EFE9DAB3;
    --ink-faint:#EFE9DA38;
    --card:#16332B;
    --ring-track:#EFE9DA24;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 120% 60% at 50% -10%, var(--bg-2), var(--bg) 70%);
    color:var(--ink);
    font-family:'Spectral', Georgia, serif;
    display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
    overflow:hidden;
    transition:background-color .6s ease, color .6s ease;
  }

  /* ---------- header ---------- */
  header{
    padding:14px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .mode-pill{
    font-family:system-ui,sans-serif;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--ink-faint); border-radius:999px;
    padding:7px 14px; color:var(--ink-soft);
    background:transparent; cursor:pointer;
  }
  .mode-pill b{color:var(--gold); font-weight:600;}
  .pos{
    font-family:system-ui,sans-serif;
    font-size:12px; letter-spacing:.12em; color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- bead progress ---------- */
  .beads{
    display:flex; gap:5px; justify-content:center; flex-wrap:wrap;
    padding:0 22px 6px; flex-shrink:0;
  }
  .bead{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink-faint);
    transition:background .3s, transform .3s;
  }
  .bead.done{background:var(--gold);}
  .bead.now{background:var(--ink); transform:scale(1.5);}

  /* ---------- card (the tap target) ---------- */
  main{
    flex:1; display:flex; flex-direction:column; min-height:0;
    padding:6px 16px 10px;
  }
  #card{
    flex:1; min-height:0;
    background:var(--card);
    border:1px solid var(--ink-faint);
    border-radius:22px;
    display:flex; flex-direction:column;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 10px 34px rgba(0,0,0,.10);
    transition:background-color .6s ease;
    position:relative;
  }
  #card:active{transform:scale(.995);}
  #card.flash::after{
    content:""; position:absolute; inset:0; border-radius:22px;
    box-shadow:inset 0 0 0 2px var(--gold);
    animation:flash .45s ease-out forwards;
    pointer-events:none;
  }
  @keyframes flash{from{opacity:1}to{opacity:0}}

  .scrollwrap{
    flex:1; min-height:0;
    overflow-y:auto;
    padding:26px 22px 8px;
    display:flex; flex-direction:column; justify-content:safe center;
    scrollbar-width:none;
  }
  .scrollwrap::-webkit-scrollbar{display:none;}

  .arabic{
    direction:rtl;
    font-family:'Scheherazade New','Noto Naskh Arabic',serif;
    font-weight:500;
    font-size:clamp(24px, 6.4vw, 34px);
    line-height:2.05;
    text-align:center;
    color:var(--ink);
  }
  .arabic.long{font-size:clamp(20px, 5.4vw, 27px); line-height:1.95;}
  .divider{
    width:54px; height:1px; background:var(--gold-soft);
    margin:18px auto 14px; flex-shrink:0;
  }
  .trans{
    font-size:14.5px; font-weight:300; font-style:italic;
    line-height:1.7; text-align:center;
    color:var(--ink-soft);
    max-width:34em; margin:0 auto;
  }
  .src{
    font-family:system-ui,sans-serif;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    text-align:center; color:var(--ink-faint);
    margin-top:12px; color:var(--ink-soft); opacity:.55;
  }

  /* ---------- counter ring ---------- */
  .counter-row{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    gap:26px; padding:8px 0 18px;
  }
  .nav{
    font-family:system-ui,sans-serif;
    background:none; border:none; color:var(--ink-faint);
    font-size:24px; padding:10px 14px; cursor:pointer; line-height:1;
  }
  .ringbox{position:relative; width:76px; height:76px;}
  .ringbox svg{width:76px; height:76px; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--ring-track); stroke-width:4;}
  .ring-fill{
    fill:none; stroke:var(--gold); stroke-width:4; stroke-linecap:round;
    transition:stroke-dashoffset .25s ease;
  }
  .count{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:system-ui,sans-serif;
  }
  .count .n{font-size:21px; font-weight:600; font-variant-numeric:tabular-nums;}
  .count .of{font-size:10px; color:var(--ink-soft); letter-spacing:.08em;}

  .hint{
    flex-shrink:0; text-align:center;
    font-family:system-ui,sans-serif;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); padding:0 0 12px;
  }

  /* ---------- finished screen ---------- */
  #doneview{display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px;}
  #doneview .arabic{font-size:clamp(26px,7vw,36px);}
  #doneview .trans{font-size:15px;}
  .restart{
    margin-top:14px;
    font-family:system-ui,sans-serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--gold-soft); color:var(--gold);
    background:none; border-radius:999px; padding:10px 22px; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>

<header>
  <button class="mode-pill" id="modeBtn" aria-label="Switch between morning and evening"></button>
  <div class="pos" id="pos"></div>
</header>

<div class="beads" id="beads"></div>

<main>
  <div id="card">
    <div class="scrollwrap" id="scrollwrap">
      <div class="arabic" id="arabic"></div>
      <div class="divider"></div>
      <div class="trans" id="trans"></div>
      <div class="src" id="src"></div>
    </div>
    <div class="counter-row">
      <button class="nav" id="prevBtn" aria-label="Previous">‹</button>
      <div class="ringbox">
        <svg viewBox="0 0 76 76">
          <circle class="ring-track" cx="38" cy="38" r="34"/>
          <circle class="ring-fill" id="ring" cx="38" cy="38" r="34"/>
        </svg>
        <div class="count"><span class="n" id="cnt">0</span><span class="of" id="cntOf"></span></div>
      </div>
      <button class="nav" id="nextBtn" aria-label="Next">›</button>
    </div>
  </div>

  <div id="doneview">
    <div class="arabic">تَقَبَّلَ اللَّهُ</div>
    <div class="trans">You have completed the adhkar for this session.<br>May Allah accept it from you.</div>
    <button class="restart" id="restartBtn">Start again</button>
  </div>
</main>

<div class="hint">Tap the card for each recitation</div>

<script>

 {aS:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",

 {a:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",

 {a:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
  t:"I seek refuge in the perfect words of Allah from the evil of what He has created.", n:3, s:"At-Tirmidhi · Ahmad", eOnly:true},

 {a:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
  t:"None has the right to be worshipped except Allah alone, without partner. His is the dominion and praise, and He is able to do all things.", n:10, s:"An-Nasa'i · Abu Dawud"},

 {a:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
  t:"Glory be to Allah and praise be to Him. (100×: sins forgiven even if like the foam of the sea.)", n:100, s:"Al-Bukhari · Muslim"},

 {a:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",
  t:"I seek the forgiveness of Allah and repent to Him.", n:100, s:"Al-Bukhari · Muslim"}
];

/* ================= STATE ================= */
const RING_C = 2 * Math.PI * 34;
let mode, list, idx = 0, count = 0, manualOverride = null;

function autoMode(){
  const h = new Date().getHours();
  return (h >= 3 && h < 12) ? "sabah" : "masa";
}
function buildList(){
  list = ADHKAR.filter(d => mode === "sabah" ? !d.eOnly : !d.mOnly);
}

/* ---- persistence (safe: ignored if blocked, e.g. file://) ---- */
function saveState(){
  try{
    localStorage.setItem("adhkar", JSON.stringify({
      d:new Date().toDateString(), m:mode, i:idx, c:count, o:manualOverride
    }));
  }catch(e){}
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem("adhkar"));
    if(s && s.d === new Date().toDateString() && s.m === mode){
      idx = Math.min(s.i, list.length); count = s.c || 0;
    }
  }catch(e){}
}

/* ================= RENDER ================= */
const $ = id => document.getElementById(id);

function render(){
  document.body.className = mode;
  $("modeBtn").innerHTML = mode === "sabah"
    ? "<b>☀ Sabah</b> · Masa'" : "Sabah · <b>☾ Masa'</b>";

  if(idx >= list.length){ showDone(true); return; }
  showDone(false);

  const d = list[idx];
  const ar = d.a || (mode === "sabah" ? d.aS : d.aM);
  $("arabic").textContent = ar;
  $("arabic").className = "arabic" + (d.long ? " long" : "");
  $("trans").textContent = d.t;
  $("src").textContent = d.s + " · " + d.n + "×";
  $("pos").textContent = (idx + 1) + " / " + list.length;
  $("cnt").textContent = count;
  $("cntOf").textContent = "of " + d.n;

  const ring = $("ring");
  ring.style.strokeDasharray = RING_C;
  ring.style.strokeDashoffset = RING_C * (1 - count / d.n);

  // beads
  const beads = $("beads");
  beads.innerHTML = "";
  list.forEach((_, i) => {
    const b = document.createElement("div");
    b.className = "bead" + (i < idx ? " done" : i === idx ? " now" : "");
    beads.appendChild(b);
  });
  $("scrollwrap").scrollTop = 0;
}

function showDone(done){
  $("card").style.display = done ? "none" : "flex";
  $("doneview").style.display = done ? "flex" : "none";
  if(done){ $("pos").textContent = list.length + " / " + list.length; }
}

/* ================= INTERACTION ================= */
function vibrate(ms){ if(navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }

function tap(){
  if(idx >= list.length) return;
  const d = list[idx];
  if(count >= d.n) return; // already complete, waiting to advance
  count++;
  vibrate(12);
  if(count >= d.n){
    $("card").classList.remove("flash");
    void $("card").offsetWidth;
    $("card").classList.add("flash");
    vibrate([14, 60, 14]);
    setTimeout(() => { idx++; count = 0; saveState(); render(); }, 380);
    $("cnt").textContent = count;
    $("ring").style.strokeDashoffset = 0;
  } else {
    $("cnt").textContent = count;
    $("ring").style.strokeDashoffset = RING_C * (1 - count / d.n);
    saveState();
  }
}

function go(delta){
  idx = Math.max(0, Math.min(list.length, idx + delta));
  count = 0; saveState(); render();
}

function switchMode(){
  manualOverride = (mode === "sabah") ? "masa" : "sabah";
  mode = manualOverride;
  idx = 0; count = 0;
  buildList(); saveState(); render();
}

/* ================= INIT ================= */
mode = autoMode();
buildList();
loadState();
render();

$("card").addEventListener("click", e => {
  if(e.target.closest(".nav")) return;
  tap();
});
$("prevBtn").addEventListener("click", e => { e.stopPropagation(); go(-1); });
$("nextBtn").addEventListener("click", e => { e.stopPropagation(); go(1); });
$("modeBtn").addEventListener("click", switchMode);
$("restartBtn").addEventListener("click", () => { idx = 0; count = 0; saveState(); render(); });
</script>
</body>
</html>
